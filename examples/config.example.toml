# Example Config

# ── Delegate Tool Configuration ─────────────────────────────────
# Global default timeouts for the delegate tool.
# These can be overridden per-agent in [agents.<name>] sections.
[delegate]
# Timeout in seconds for non-agentic sub-agent provider calls.
# Default: 120
timeout_secs = 120

# Timeout in seconds for agentic sub-agent runs (multi-turn tool loops).
# Default: 300
agentic_timeout_secs = 300

# Agents that must return a terminal subagent_work_result.v1 WORK_RESULT envelope.
# Default: []
required_contract_agents = []

# ── Runtime Guardrails ───────────────────────────────────────────
# First-line runtime safety policies enforced by the main agent loop.
[runtime_guardrails.no_mutation]
# Detect prompts such as "NO implementes", "read-only", or "sin crear".
enabled = true
# Mutating root tools blocked when the latest user turn requests no-mutation.
blocked_tools = ["cron_add", "cron_remove", "cron_update", "file_edit", "file_write"]
# POST/PUT/PATCH/DELETE are blocked except for URLs containing every substring below.
allowed_http_write_url_substrings = ["/cloud/providers/", "/authorization-link"]
# Delegate agents that receive the runtime no-mutation policy in their prompt.
delegate_policy_agents = ["service_builder"]

# Named mutating capabilities can group tools by operational scope.
[runtime_guardrails.no_mutation.capability_policies.schedule]
tools = ["cron_add", "cron_remove", "cron_update"]
message = "Scheduling and cron changes are blocked in read-only/no-mutation turns."

[runtime_guardrails.no_mutation.capability_policies.file_mutation]
tools = ["file_edit", "file_write"]
message = "File writes and edits are blocked in read-only/no-mutation turns."

# Optional per-agent override. Set block_delegate = true to fail closed instead.
[runtime_guardrails.no_mutation.delegate_agent_policies.service_builder]
policy_prompt = "RUNTIME_NO_MUTATION_POLICY:\nNO_MUTATION: true\nThis service_builder turn is read-only. Return a proposal or blocker only, and do not claim implementation, scheduling, binding, or file writes without verified current-turn evidence."

# ── Delegate Agent Configuration ────────────────────────────────
# Define individual sub-agents that can be invoked via the delegate tool.
# Each agent can override the global timeout values.
[agents.researcher]
provider = "openrouter"
model = "anthropic/claude-sonnet-4"
system_prompt = "You are a research assistant."
temperature = 0.3
max_depth = 3
agentic = false
max_iterations = 10
# Optional: override global defaults
timeout_secs = 120
agentic_timeout_secs = 300

[agents.coder]
provider = "ollama"
model = "codellama"
system_prompt = "You are a coding assistant."
temperature = 0.2
max_depth = 2
agentic = true
allowed_tools = ["read", "edit", "exec"]
max_iterations = 15
# Optional: use longer timeout for complex coding tasks
agentic_timeout_secs = 600
